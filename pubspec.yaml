name: spiral_notebook
description: "A skeuomorphic spiral notebook for notes, outlines, checklists, spreadsheets and quick math."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.7
  file_picker: ^13.2.0
  flutter:
    sdk: flutter
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.6
  video_player: ^2.14.1
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Regular.ttf
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
