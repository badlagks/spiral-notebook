# Builds the notebook for every device on each push, and keeps the files
# for download under the run's "Artifacts".
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    # One APK for Android phones and Chromebooks.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The app's signing key, from the repository's secrets if it has one.
      - name: Get the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/app.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/app.jks" >> "$GITHUB_ENV"
          fi
      # Each build gets a higher number, so a phone takes it as an update.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk spiral-notebook.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spiral-notebook-android
          path: spiral-notebook.apk
      # Also kept as a plain .apk on the Releases page, which a phone can
      # download and open directly (Artifacts always come as a .zip).
      - name: Put the APK on the "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest test build" --notes "Newest build from main. On an Android phone, download spiral-notebook.apk and open it to install."
          gh release upload latest spiral-notebook.apk --clobber

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: spiral-notebook-web
          path: build/web

  apple:
    # The Mac app, and an unsigned iPhone build that checks it compiles.
    # Installing on an iPhone needs an Apple developer account (TestFlight).
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build macos --release
      - name: Zip the Mac app
        run: cd build/macos/Build/Products/Release && ditto -c -k --keepParent spiral_notebook.app spiral-notebook-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: spiral-notebook-mac
          path: build/macos/Build/Products/Release/spiral-notebook-mac.zip
      - run: flutter build ios --release --no-codesign
